<!DOCTYPE html>
<html>
    <head>
        <style>

            body{

    <body>

<pre><code>

<pre><code>

        </div>

        </div>
        
        <script>
        function KopiujCode(button) {
            const code = button.parentElement.querySelector("code").innerText;

            navigator.clipboard.writeText(code);

            button.innerText = "Skopiowano!";
            
            setTimeout(() => {
                button.innerText = "Kopiuj";
            }, 1500);
        }
        </script>
    </body>
